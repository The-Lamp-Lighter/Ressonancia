<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Breach</title>
<meta name="description" content="Neon Breach: jogo solo top-down de invasão e resgate, com hack por sequência de setas.">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- SELEÇÃO DE MISSÃO (primeira tela) -->
  <section class="screen" id="s-select">
    <div class="sel-wrap">
      <header class="sel-head">
        <button class="btn ghost sm" id="sel-back">← Jogos</button>
        <div id="sel-tabs"></div>
        <div class="sel-tools">
          <button class="btn ghost sm" id="sel-help" aria-label="Como jogar">?</button>
          <button class="btn ghost sm" id="sel-sfx" aria-pressed="true">Efeitos: ligados</button>
          <button class="btn ghost sm" id="sel-mus" aria-pressed="false">Trilha: desligada</button>
        </div>
      </header>
      <p id="sel-desc"></p>
      <nav id="ladder" aria-label="Níveis de dificuldade"></nav>
      <div id="sel-grid"></div>
    </div>
  </section>

  <!-- MISSÃO -->
  <section class="screen" id="s-mission">
    <div id="mi-view">
      <canvas id="tac-cv"></canvas>
      <div id="mi-alarm"></div>
      <div id="mi-obj" class="mono"></div>
      <div id="mi-right">
        <div id="mi-det"><span class="mono">Rastreamento</span><div class="detbar"><i id="mi-det-fill"></i></div><b id="mi-det-state" class="mono">fantasma</b></div>
        <div id="mi-timer" class="mono"></div>
        <canvas id="mini-cv"></canvas>
        <button class="btn sm ghost" id="mi-pause">Pausa [Esc]</button>
      </div>

      <div id="mi-prompt" class="mono"></div>

      <!-- minigame de hack: sequência de setas -->
      <div id="mi-hack" class="panel">
        <div class="hk-head"><b id="hk-name"></b><span id="hk-count" class="mono"></span></div>
        <div id="hk-seq"></div>
        <span id="hk-pen" class="mono"></span>
        <div class="hk-bar"><i id="hk-fill"></i><span id="hk-time" class="mono"></span></div>
        <div class="hk-foot"><span class="mono">Setas ou WASD · errar reinicia a sequência</span><button class="btn sm ghost" id="hk-cancel">Cancelar [Esc]</button></div>
      </div>

      <div id="mi-hint" class="mono"></div>
      <div id="mi-pad">
        <button data-k="up" aria-label="Cima">▲</button>
        <button data-k="left" aria-label="Esquerda">◀</button>
        <button data-k="down" aria-label="Baixo">▼</button>
        <button data-k="right" aria-label="Direita">▶</button>
      </div>
      <div id="mi-btns"><button id="mi-act" aria-label="Hackear">HACK</button><button id="mi-sneak" aria-label="Agachar">AGACHAR</button></div>
      <div id="mi-overlay"></div>
    </div>
  </section>

  <!-- RESULTADO -->
  <section class="screen" id="s-result"><div class="result-wrap" id="result-wrap"></div></section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>

<script src="js/core.js"></script>
<script src="js/host.js"></script>
<script src="js/audio.js"></script>
<script src="js/catalog.js"></script>
<script src="js/mapdata.js"></script>
<script src="js/maps.js"></script>
<script src="js/hack.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
