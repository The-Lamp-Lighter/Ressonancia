  const g=ctx.createRadialGradient(0,0,0,0,0,50);g.addColorStop(0,`hsla(${h},100%,70%,.55)`);g.addColorStop(1,`hsla(${h},100%,60%,0)`);
  ctx.fillStyle=g;ctx.fillRect(-50,-50,100,100);ctx.strokeStyle=`hsl(${h},100%,80%)`;ctx.lineWidth=1.5;
  ctx.rotate(t);ctx.strokeRect(-10,-10,20,20);ctx.rotate(-t*2);ctx.strokeRect(-6,-6,12,12);
  ctx.beginPath();ctx.arc(0,0,3,0,6.28);ctx.fillStyle='#fff';ctx.fill();ctx.restore()}
function bg(){
  const d=room,h=d.h,t=G.time,px=(p.x-cam.x-W/2),py=(p.y-cam.y-H/2);
  let g;
  if(!EMB){g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${h},75%,15%)`);g.addColorStop(1,`hsl(${h+30},80%,6%)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  ctx.globalCompositeOperation='lighter';
  if(!EMB){g=ctx.createRadialGradient(W*.72,H*.38,0,W*.72,H*.38,400);g.addColorStop(0,`hsla(${h+40},95%,58%,.34)`);g.addColorStop(1,'hsla(0,0%,0%,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  for(let i=0;i<3;i++){const bx=d.sh[i].x,w=50+i*30;g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsla(${h+30},90%,60%,.08)`);g.addColorStop(1,'hsla(0,0%,0%,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+w,0);ctx.lineTo(bx+w-170,H);ctx.lineTo(bx-170,H);ctx.fill()}
  ctx.save();ctx.translate(W*.72-px*.02,H*.38-py*.02);
  for(let i=0;i<6;i++){const r=70+i*55;ctx.strokeStyle=`hsla(${h},80%,70%,${.07+(i%2)*.03})`;ctx.lineWidth=1;ctx.setLineDash(i%2?[4,12]:[]);ctx.lineDashOffset=-t*(8+i*3)*(i%2?1:-1);
    ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.stroke();
    if(i%2==0){const a=t*(.25+i*.05)+i;ctx.setLineDash([]);ctx.fillStyle=`hsla(${h+30},100%,75%,.5)`;ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,3,0,6.28);ctx.fill()}}
  ctx.restore();ctx.setLineDash([]);
  for(const o of d.bgs||[])bgS(o,h,px,py);
  for(const s of d.sh){
    const xx=(((s.x+t*s.v*30)%(W+120))+W+120)%(W+120)-60-px*.06*s.z,yy=s.y-py*.06*s.z,z=s.s*s.z;
    ctx.save();ctx.translate(xx,yy);ctx.rotate(s.a+t*s.v);ctx.strokeStyle=`hsla(${h+s.t*30},80%,70%,${.04+.1*s.z})`;ctx.lineWidth=1;ctx.beginPath();
    if(s.t==0)ctx.arc(0,0,z/2,0,6.28);else if(s.t==1)ctx.arc(0,0,z/2,0,3.8);else{ctx.arc(0,0,z/3,0,6.28);ctx.moveTo(z/2,0);ctx.arc(0,0,z/2,0,1.2)}
    ctx.stroke();ctx.restore()}
  for(const o of d.dots){const yy=((o.y-t*o.z*7)%H+H)%H;ctx.fillStyle=`rgba(200,240,255,${.15+.35*Math.abs(Math.sin(t*1.4+o.p))})`;ctx.beginPath();ctx.arc(o.x-px*.04*o.z,yy,.6+o.z*1.2,0,6.28);ctx.fill()}
  const m=d.amb|0;
  for(let i=0;i<(m?40:28);i++){const o=d.dots[i%45],a=t*.4+o.p*3;let x,y,hu=h+10;
    if(m==1){x=((o.x+i*7+t*14)%W+W)%W;y=((o.y*1.3+t*260*o.z+i*31)%H+H)%H;ctx.strokeStyle=`hsla(${h+20},90%,75%,.35)`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3,y+14);ctx.stroke();continue}
    if(m==2){x=o.x+Math.sin(t*.8+o.p)*25;y=((o.y-t*55*o.z)%H+H)%H;hu=20}
    else if(m==3){x=o.x+Math.sin(t*.5+o.p)*40;y=((o.y+t*20*o.z)%H+H)%H;hu=h+40}
    else{x=((o.x+Math.sin(a)*60+t*8*o.z)%W+W)%W;y=((o.y+Math.cos(a*.8)*40-t*5*o.z)%H+H)%H}
    x-=px*.1;y-=py*.1;const k=.5+.5*Math.sin(t*3+o.p*5),g2=ctx.createRadialGradient(x,y,0,x,y,11);g2.addColorStop(0,`hsla(${hu},100%,75%,${.7*k})`);g2.addColorStop(1,'hsla(0,0%,0%,0)');ctx.fillStyle=g2;ctx.fillRect(x-11,y-11,22,22)}
  ctx.globalCompositeOperation='source-over';
}
function bgS(o,h,px,py){
  const s=o.s,x=(o.x%(W+300))-150-cam.x*o.z-px*.04,y=H*.9-py*.05;
  ctx.save();ctx.globalCompositeOperation='source-over';ctx.translate(x,y);ctx.strokeStyle=`hsla(${h+20},70%,70%,${.07+o.z*.14})`;ctx.fillStyle='rgba(0,0,0,.2)';ctx.lineWidth=2;ctx.beginPath();
  if(o.t=='arch'){ctx.rect(-60*s,-260*s,22*s,260*s);ctx.rect(38*s,-260*s,22*s,260*s);ctx.moveTo(-60*s,-260*s);ctx.arc(0,-260*s,60*s,Math.PI,0)}
  else if(o.t=='tower'){ctx.rect(-28*s,-340*s,56*s,340*s);ctx.rect(-40*s,-360*s,80*s,20*s);for(let k=0;k<5;k++){ctx.moveTo(-6*s,-(300-k*50)*s);ctx.lineTo(6*s,-(300-k*50)*s)}}
  else if(o.t=='statue'){ctx.moveTo(-44*s,0);ctx.lineTo(-20*s,-220*s);ctx.lineTo(20*s,-220*s);ctx.lineTo(44*s,0);ctx.closePath();ctx.moveTo(24*s,-250*s);ctx.arc(0,-250*s,24*s,0,6.28)}
  else if(o.t=='ring'){ctx.arc(0,-190*s,110*s,0,6.28);ctx.moveTo(78*s,-190*s);ctx.arc(0,-190*s,78*s,0,6.28);for(let k=0;k<8;k++){const a=k*.785;ctx.moveTo(Math.cos(a)*78*s,-190*s+Math.sin(a)*78*s);ctx.lineTo(Math.cos(a)*110*s,-190*s+Math.sin(a)*110*s)}}
  else{for(let k=0;k<4;k++)ctx.rect((k-1.5)*70*s-9*s,-200*s,18*s,200*s)}
  ctx.fill();ctx.stroke();ctx.restore()}
let vig;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  if(EMB){ctx.clearRect(0,0,cv.width,cv.height);if(!DARK){ctx.fillStyle='rgba(6,9,22,.62)';ctx.fillRect(0,0,cv.width,cv.height)}}else{ctx.fillStyle='#03050b';ctx.fillRect(0,0,cv.width,cv.height)}
  ctx.save();ctx.setTransform(S,0,0,S,OX,OY);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*10,(Math.random()-.5)*G.shake*10);
  ctx.save();zoomT();bg();ctx.save();ctx.translate(-cam.x,-cam.y);bigText();props();ctx.drawImage(room.cache,0,0,GW*T,GH*T);
  // espinhos
  ctx.shadowColor='#ff4f9a';ctx.shadowBlur=10;ctx.fillStyle='rgba(255,79,154,.18)';ctx.strokeStyle='#ff7ab6';ctx.lineWidth=1.5;
  for(const [tx,ty,w] of room.sp)for(let i=0;i<w*2;i++){const X=tx*T+i*16,Y=(ty+1)*T;ctx.beginPath();ctx.moveTo(X+1,Y);ctx.lineTo(X+8,Y-18);ctx.lineTo(X+15,Y);ctx.closePath();ctx.fill();ctx.stroke()}
  ctx.shadowBlur=0;
  objs();
  // partículas
  ctx.globalCompositeOperation='lighter';
  for(const q of P){const a=q.l/q.m;
    if(q.gh){ctx.strokeStyle=`hsla(45,100%,70%,${a*.6})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(q.x,q.y,p.w,p.h,9);ctx.stroke()}
    else{ctx.fillStyle=`hsla(${q.h},100%,70%,${a})`;ctx.beginPath();ctx.arc(q.x,q.y,q.r*a+.5,0,6.28);ctx.fill()}}
  ctx.globalCompositeOperation='source-over';
  drawPlayer();bubble();
  ctx.restore();ctx.restore();
  // vinheta
  if(!vig){vig=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,EMB?'rgba(0,0,0,.28)':'rgba(0,0,0,.65)')}
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(G.flash>0){ctx.fillStyle=`rgba(255,225,150,${G.flash*.35})`;ctx.fillRect(0,0,W,H)}
  if(G.fade>0){ctx.fillStyle=`rgba(3,5,11,${G.fade})`;ctx.fillRect(0,0,W,H)}
  if(!G.door&&!G.kc)hud();hud2();hud3();hud4();
  ctx.restore();
}
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(.1,(t-last)/1000);last=t;while(acc>=1/60){step(G.slow||1/60);acc-=1/60}audioTick();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(EMB){try{parent.postMessage({nb:'ready'},'*')}catch(e){}}
</script></body></html>
